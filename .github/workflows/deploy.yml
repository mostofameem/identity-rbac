name: Deploy to AWS EC2

on:
  # Trigger on tag creation (for releases)
  push:
    tags:
      - 'v*.*.*'  # Matches v1.0.0, v2.1.3, etc.
      - 'release-*'  # Matches release-1.0, release-staging, etc.
  
  # Manual workflow dispatch with branch selection
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop
          - deployment-dev
          - staging
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      version:
        description: 'Version tag (optional)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}
    
    - name: Set deployment info
      id: deployment-info
      run: |
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" =~ ^refs/tags/ ]]; then
          echo "trigger=tag" >> $GITHUB_OUTPUT
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "environment=production" >> $GITHUB_OUTPUT
        elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "trigger=manual" >> $GITHUB_OUTPUT
          echo "version=${{ github.event.inputs.version || 'manual-deploy' }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
        fi
        echo "timestamp=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
    
    - name: Display deployment info
      run: |
        echo "🚀 Deployment Information:"
        echo "Trigger: ${{ steps.deployment-info.outputs.trigger }}"
        echo "Version: ${{ steps.deployment-info.outputs.version }}"
        echo "Branch: ${{ steps.deployment-info.outputs.branch }}"
        echo "Environment: ${{ steps.deployment-info.outputs.environment }}"
        echo "Timestamp: ${{ steps.deployment-info.outputs.timestamp }}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create .env file
      run: |
        echo "HTTP_PORT=${{ secrets.HTTP_PORT }}" >> .env
        echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
        echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
        echo "DB_USER=${{ secrets.DB_USER }}" >> .env
        echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
        echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
        echo "DB_SSL_MODE=${{ secrets.DB_SSL_MODE }}" >> .env
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
        echo "MAIL_HOST=${{ secrets.MAIL_HOST }}" >> .env
        echo "MAIL_PORT=${{ secrets.MAIL_PORT }}" >> .env
        echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env
        echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env

    - name: Build Docker images
      run: |
        # Build with version tags
        VERSION="${{ steps.deployment-info.outputs.version }}"
        docker-compose build --no-cache
        
        # Tag images with version
        docker tag rbac-backend:latest rbac-backend:$VERSION
        docker tag rbac-frontend:latest rbac-frontend:$VERSION

    - name: Save Docker images
      run: |
        VERSION="${{ steps.deployment-info.outputs.version }}"
        docker save rbac-backend:latest rbac-backend:$VERSION | gzip > backend.tar.gz
        docker save rbac-frontend:latest rbac-frontend:$VERSION | gzip > frontend.tar.gz

    - name: Copy files to EC2
      uses: appleboy/scp-action@v0.1.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "backend.tar.gz,frontend.tar.gz,deployment/docker-compose.prod.yml,deployment/scripts/deploy.sh,.env"
        target: "/home/${{ secrets.EC2_USER }}/rbac-app"

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/${{ secrets.EC2_USER }}/rbac-app
          
          # Load Docker images
          docker load < backend.tar.gz
          docker load < frontend.tar.gz
          
          # Stop existing containers
          docker-compose -f deployment/docker-compose.prod.yml down || true
          
          # Remove old images
          docker image prune -f
          
          # Start new containers
          docker-compose -f deployment/docker-compose.prod.yml up -d
          
          # Clean up
          rm -f backend.tar.gz frontend.tar.gz
          
          # Create deployment log
          echo "$(date): Deployed version ${{ steps.deployment-info.outputs.version }} from branch ${{ steps.deployment-info.outputs.branch }}" >> /home/${{ secrets.EC2_USER }}/rbac-app/deployment.log
          
          # Health check
          sleep 10
          curl -f http://localhost:5001/health-check || exit 1
          
          echo "🎉 Deployment completed successfully!"
          echo "Version: ${{ steps.deployment-info.outputs.version }}"
          echo "Branch: ${{ steps.deployment-info.outputs.branch }}"
          echo "Environment: ${{ steps.deployment-info.outputs.environment }}"
          
    - name: Deployment notification
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ Deployment SUCCESS: Version ${{ steps.deployment-info.outputs.version }} deployed to ${{ steps.deployment-info.outputs.environment }}"
        else
          echo "❌ Deployment FAILED: Version ${{ steps.deployment-info.outputs.version }} failed to deploy"
        fi
