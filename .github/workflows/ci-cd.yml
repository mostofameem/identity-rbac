name: CI/CD Pipeline

on:
  push:
    tags:
      - "v*.*.*"   # Runs only on tag push like v1.0.0

env:
  TAG: ${{ github.ref_name }}

jobs:
  # Job 1: Build Backend
  build-backend:
    name: 🏗️ Build Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build & Push Backend Image
        run: |
          echo "Building backend with tag: ${{ env.TAG }}"
          docker build -t ${{ secrets.DOCKER_USERNAME }}/rbac-backend:${{ env.TAG }} ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/rbac-backend:${{ env.TAG }}
          echo "✅ Backend image pushed successfully"

  # Job 2: Build Frontend  
  build-frontend:
    name: 🎨 Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🎨 Build & Push Frontend Image
        run: |
          echo "Building frontend with tag: ${{ env.TAG }}"
          docker build -t ${{ secrets.DOCKER_USERNAME }}/rbac-frontend:${{ env.TAG }} ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/rbac-frontend:${{ env.TAG }}
          echo "✅ Frontend image pushed successfully"

  # Job 3: Deploy to Server
  deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    steps:
      - name: 🚀 Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🚀 Starting deployment with tag: ${{ env.TAG }}"
            
            # Create directory
            mkdir -p /services/rbac
            cd /services/rbac

            # Generate docker-compose.yml with the new tag
            echo "📝 Generating docker-compose.yml"
            cat > docker-compose.yml <<EOL
            services:
              backend:
                container_name: rbac-backend
                image: ${{ secrets.DOCKER_USERNAME }}/rbac-backend:${{ env.TAG }}
                env_file:
                  - .env
                ports:
                  - "\${HTTP_PORT}:\${HTTP_PORT}"
                networks:
                  - rbac-network

              frontend:
                container_name: rbac-frontend
                image: ${{ secrets.DOCKER_USERNAME }}/rbac-frontend:${{ env.TAG }}
                ports:
                  - "3000:80"
                depends_on:
                  - backend
                networks:
                  - rbac-network

            networks:
              rbac-network:
                driver: bridge
            EOL

            # Pull new images & restart
            echo "📦 Pulling new images..."
            docker-compose pull
            
            echo "🔄 Restarting services..."
            docker-compose up -d
            
            echo "✅ Deployment completed successfully!"

  # Job 4: Health Check
  health-check:
    name: 🩺 Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    
    steps:
      - name: 🩺 Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🩺 Running health checks..."
            
            # Wait for services to start
            sleep 30
            
            # Check if containers are running
            echo "📊 Container status:"
            cd /services/rbac && docker-compose ps
            
            # Health check backend (retry up to 5 times)
            echo "🔍 Checking backend health..."
            for i in {1..5}; do
              if curl -f http://localhost:5001/health >/dev/null 2>&1; then
                echo "✅ Backend is healthy!"
                break
              else
                echo "⏳ Backend not ready yet (attempt $i/5)..."
                sleep 10
              fi
            done
            
            # Health check frontend
            echo "🔍 Checking frontend health..."
            if curl -f http://localhost:3000 >/dev/null 2>&1; then
              echo "✅ Frontend is healthy!"
            else
              echo "⚠️ Frontend might need more time to start"
            fi
            
            echo "🎉 Health check completed!"
