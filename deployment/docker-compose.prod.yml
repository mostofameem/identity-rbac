services:
  # Backend API
  backend:
    image: ${DOCKER_USERNAME}/rbac-backend:${TAG:-latest}
    container_name: rbac-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HTTP_PORT:-5001}:${HTTP_PORT:-5001}"
    networks:
      - rbac-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${HTTP_PORT:-5001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    image: ${DOCKER_USERNAME}/rbac-frontend:${TAG:-latest}
    container_name: rbac-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rbac-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

# No volumes needed for external database

networks:
  rbac-network:
    driver: bridge
